<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="900" height="500" fill="#0d1117"/>
  <rect x="0" y="0" width="900" height="1" fill="#21262d"/>

  <!-- Title -->
  <text x="40" y="44" font-family="'SF Mono','JetBrains Mono','Fira Code',monospace"
        font-size="13" fill="#8b949e" letter-spacing="0.5">openflow / architecture</text>

  <!-- REST API box -->
  <rect x="360" y="70" width="180" height="52" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="91" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#e6edf3">REST API</text>
  <text x="450" y="109" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#8b949e">Gin · OpenTelemetry</text>

  <!-- Arrow down -->
  <line x1="450" y1="122" x2="450" y2="155" stroke="#30363d" stroke-width="1"/>
  <polygon points="444,152 450,163 456,152" fill="#30363d"/>

  <!-- Workflow Engine box -->
  <rect x="310" y="163" width="280" height="56" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="187" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#e6edf3">Workflow Engine / Scheduler</text>
  <text x="450" y="207" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#8b949e">DAG parser · RBAC · Optimistic locking</text>

  <!-- Arrow left to Worker Pool -->
  <line x1="310" y1="191" x2="230" y2="191" stroke="#30363d" stroke-width="1"/>
  <polygon points="233,185 222,191 233,197" fill="#30363d"/>

  <!-- Arrow right to DLQ -->
  <line x1="590" y1="191" x2="660" y2="191" stroke="#30363d" stroke-width="1"/>
  <polygon points="657,185 668,191 657,197" fill="#30363d"/>

  <!-- Worker Pool box -->
  <rect x="90" y="163" width="140" height="56" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="160" y="187" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#e6edf3">Worker Pool</text>
  <text x="160" y="207" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#8b949e">gRPC · Context cancel</text>

  <!-- Dead Letter Queue box -->
  <rect x="660" y="163" width="150" height="56" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="735" y="187" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#e6edf3">Dead Letter Queue</text>
  <text x="735" y="207" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#8b949e">Replay · Inspect</text>

  <!-- Arrow down from Worker Pool -->
  <line x1="160" y1="219" x2="160" y2="255" stroke="#30363d" stroke-width="1"/>
  <polygon points="154,252 160,263 166,252" fill="#30363d"/>

  <!-- NATS JetStream box -->
  <rect x="50" y="263" width="220" height="52" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="160" y="285" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#e6edf3">NATS JetStream</text>
  <text x="160" y="303" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#8b949e">Durable streams · Consumer groups</text>

  <!-- Arrow down from NATS -->
  <line x1="160" y1="315" x2="160" y2="350" stroke="#30363d" stroke-width="1"/>
  <polygon points="154,347 160,358 166,347" fill="#30363d"/>

  <!-- PostgreSQL box -->
  <rect x="50" y="358" width="220" height="52" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="160" y="380" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#e6edf3">PostgreSQL</text>
  <text x="160" y="398" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#8b949e">Optimistic locking · Connection pool</text>

  <!-- Redis box (side) -->
  <rect x="310" y="358" width="140" height="52" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="380" y="380" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#e6edf3">Redis</text>
  <text x="380" y="398" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#8b949e">Cache · Rate limit</text>
  <line x1="270" y1="384" x2="310" y2="384" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Prometheus + OTel (observability layer) -->
  <rect x="500" y="263" width="200" height="52" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="600" y="285" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#8b949e">Observability</text>
  <text x="600" y="303" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#8b949e">Prometheus · OpenTelemetry</text>

  <!-- dashed connector from Engine to Observability -->
  <line x1="590" y1="219" x2="590" y2="256" stroke="#21262d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="590" y1="256" x2="600" y2="263" stroke="#21262d" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <line x1="40" y1="460" x2="70" y2="460" stroke="#30363d" stroke-width="1"/>
  <text x="78" y="464" font-family="'SF Mono',monospace" font-size="10" fill="#8b949e">data path</text>
  <line x1="150" y1="460" x2="180" y2="460" stroke="#21262d" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="188" y="464" font-family="'SF Mono',monospace" font-size="10" fill="#8b949e">metrics path</text>

  <rect x="0" y="499" width="900" height="1" fill="#21262d"/>
</svg>
